[project]
name = "cpp-bug-fixer-agent"
version = "0.1.0"
description = "A transparent CLI coding agent that fixes logical bugs in a C++ project using the Gemini API."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.50.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
